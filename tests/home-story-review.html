<div class="spacer">離開影片測試暫停</div></main><script type="module">import "../src/home-story.css";import {initStoryVideo} from "../src/home-story";if(new URLSearchParams(location.search).has("reduced")){const original=window.matchMedia;window.matchMedia=q=>q.includes("prefers-reduced-motion")?Object.assign(new EventTarget(),{matches:true}):original(q);}initStoryVideo(document.querySelector("[data-pov-story]"));</script></html>
