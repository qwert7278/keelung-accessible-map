<!doctype html><html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Tag 本地照片交接</title>
<body><h1>Road Tag 本地照片交接</h1><p>僅連線本機。先取得照片 token，再交給 MCP client；不會自動建立案件。</p>
<form><p><label>Alpha credential <input name="credential" type="password" required autocomplete="off"></label></p>
<p><label>Operation UUID <input name="operation" required></label></p><p><label>Report UUID <input name="report" required></label></p>
<p><label>照片用途 <select name="kind"><option value="before">新案件現場照片</option><option value="updates">既有案件補充照片</option></select></label></p>
<p><label>照片 <input name="photo" type="file" accept="image/*,.heic,.heif" required></label></p><button>處理照片並產生 token</button></form><pre role="status"></pre>
<script type="module" src="/tests/mcp-uploader.ts"></script></body></html>
